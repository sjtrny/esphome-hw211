substitutions:
  name: hw211
  friendly_name: HW211 Controller

esp32:
  board: esp32-s3-devkitc-1
  flash_size: 16MB
  framework:
    type: esp-idf

psram:
  mode: octal
  speed: 80MHz

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

logger:
  level: INFO
  hardware_uart: USB_SERIAL_JTAG
  logs:
    modbus: ERROR

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none
  fast_connect: true

api:

ota:
  - platform: esphome

web_server:
  port: 80

external_components:
  - source:
      type: local
      path: components

uart:
  id: rs485
  tx_pin: GPIO17
  rx_pin: GPIO18
  baud_rate: 9600
  data_bits: 8
  parity: NONE
  stop_bits: 1

modbus:
  uart_id: rs485
  send_wait_time: 250ms
  turnaround_time: 100ms

modbus_controller:
  - id: hw211_modbus
    address: 99
    update_interval: 30s

hw211:
  modbus_controller_id: hw211_modbus
  name_prefix: "HW211"
  force_update: true
  create_controls: false
  create_binary_sensors: false
